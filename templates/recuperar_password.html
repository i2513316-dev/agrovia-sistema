{% extends "base.html" %}
{% block title %}{{ t('rec.titulo') }}{% endblock %}
{% block content %}
<main class="container">
    <section class="form">
        <h1>{{ t('rec.titulo') }}</h1>

        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

        <form method="post">
            <label for="correo">{{ t('rec.correo') }}</label>
            <input id="correo" name="correo" type="email" autocomplete="email" required>

            <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>

            <button type="submit" class="btn">{{ t('rec.boton') }}</button>
        </form>

        <p><a href="{{ url_for('login') }}">{{ t('rec.volver') }}</a></p>
    </section>
</main>
{% endblock %}
