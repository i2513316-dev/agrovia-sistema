{% extends "base.html" %}

{% block content %}

<div class="form">

    <h2>{{ t('login.titulo') }}</h2>

    <p class="muted">{{ t('login.ayuda') }}</p>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <form method="POST">

        <label>{{ t('login.usuario') }}</label>
        <input type="text" name="login" required>

        <label>{{ t('login.password') }}</label>
        <input type="password" name="password" required>

        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>

        <button class="btn" type="submit">{{ t('login.boton') }}</button>

    </form>

    <br>

    <p>
        {{ t('login.sin_cuenta') }}
        <a href="{{ url_for('registro') }}">{{ t('nav.registro') }}</a>
    </p>

    <p>
        <a href="{{ url_for('recuperar_cuenta') }}">{{ t('login.olvido') }}</a>
    </p>

</div>

{% endblock %}
